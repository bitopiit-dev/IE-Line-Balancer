<style>
/* ===== Tokens: indigo dye, marigold spool, teal thread ===== */
:root{
  --bg:#F1F3F9; --panel:#FFFFFF; --panel-2:#F5F7FC; --ink:#141A33; --ink-2:#4A5476; --ink-3:#8790AE;
  --rule:#E0E5F0; --denim:#2B3A8F; --denim-2:#E7EBFA; --thread:#0E9F9A; --spool:#F5A524; --spool-ink:#2A1A00;
  --hero:#131938; --hero-2:#1E2656; --hero-3:#2A3370; --hero-ink:#F1F3FF; --hero-dim:#A4ACD8;
  --ok:#119C4F; --ok-bg:#E2F5EA; --warn:#D98200; --warn-bg:#FFF1D9; --bad:#E0264A; --bad-bg:#FDE5EA;
  --idle:#D3D9E7; --focus:#3D6BFF;
  --shadow:0 1px 2px rgba(20,26,51,.06),0 6px 20px -8px rgba(20,26,51,.14);
  --radius-s:8px; --radius:14px;
  --display:"Anek Bangla","Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
  --body:"Hind Siliguri","Noto Sans Bengali","Nirmala UI","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F23; --panel:#141A35; --panel-2:#1A2142; --ink:#EEF1FF; --ink-2:#B3BBDE; --ink-3:#7F89B4;
  --rule:#262F57; --denim:#93A5FF; --denim-2:#212A58; --thread:#35D2C8; --spool:#FFB940;
  --hero:#080B1C; --hero-2:#121838; --hero-3:#1D2552;
  --ok:#3FD987; --ok-bg:#103724; --warn:#FFB23E; --warn-bg:#3A2A0C; --bad:#FF5C7A; --bad-bg:#3E1320;
  --idle:#2E3862; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B0F23; --panel:#141A35; --panel-2:#1A2142; --ink:#EEF1FF; --ink-2:#B3BBDE; --ink-3:#7F89B4;
  --rule:#262F57; --denim:#93A5FF; --denim-2:#212A58; --thread:#35D2C8; --spool:#FFB940;
  --hero:#080B1C; --hero-2:#121838; --hero-3:#1D2552;
  --ok:#3FD987; --ok-bg:#103724; --warn:#FFB23E; --warn-bg:#3A2A0C; --bad:#FF5C7A; --bad-bg:#3E1320;
  --idle:#2E3862; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ===== App bar (dark indigo, continues into the floor hero) ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--hero-ink)}
.bar-in{max-width:1360px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:11px;background:var(--spool);color:var(--spool-ink);font-family:var(--display);font-weight:800;font-size:.95rem;font-stretch:115%;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand b{display:block;font-family:var(--display);font-size:1.22rem;font-weight:700;line-height:1.1;letter-spacing:-.005em;white-space:nowrap}
.brand span:not(.logo){display:block;color:var(--hero-dim);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt{min-width:0}
.bar-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--hero-dim);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle);display:inline-block}
.sync.cloud i{background:#3FD987;box-shadow:0 0 0 3px rgba(63,217,135,.25)} .sync.local i{background:var(--spool)}
.bar .seg{border-color:var(--hero-3);background:var(--hero-2)}
.bar .seg button{color:var(--hero-dim)}
.seg.theme button{display:grid;place-items:center;padding:4px 9px;min-height:28px}
.bar .seg button[aria-pressed="true"]{background:var(--spool);color:var(--spool-ink)}
input[type=date].dt{border:1px solid var(--hero-3);border-radius:999px;padding:4px 12px;background:var(--hero-2);color:var(--hero-ink);font-size:.85rem;color-scheme:dark}
nav.tabs{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px -4px 0;padding-bottom:10px}
nav.tabs::-webkit-scrollbar{display:none}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--ink-2);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--denim);color:var(--panel);font-weight:600}

main{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius-s);padding:9px 14px;font-size:.86rem;margin-bottom:16px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;margin-bottom:18px;min-width:0;box-shadow:var(--shadow)}

/* ===== Buttons ===== */
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,border-color .15s,background .15s}

.btn.danger{color:var(--bad)}

/* ===== Fields ===== */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 14px}
.f label{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.f input,.f select{width:100%;border:1px solid var(--rule);border-radius:10px;padding:7px 11px;background:var(--panel-2);min-height:38px;transition:border-color .15s,background .15s}

/* ===== KPI tiles ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{position:relative;background:var(--panel-2);border-radius:12px;padding:12px 14px 12px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--denim)}

.note{border-radius:10px;padding:11px 14px;font-size:.92rem;margin-top:14px}

/* ===== Tables ===== */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}

tbody tr:hover td{background:var(--panel-2)}
td input,td select{width:100%;min-width:60px;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent}
td input:not(:disabled){border-bottom:1px dashed var(--rule)}
td input:hover:not(:disabled),td select:hover:not(:disabled){border-color:var(--rule)}
td input:focus{border-color:var(--denim);background:var(--panel);outline:none}
td.r,th.r{text-align:right}
tr.hot td{background:var(--bad-bg)}
tbody tr.hot:hover td{background:var(--bad-bg)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.idle{background:var(--panel-2);color:var(--ink-3)}
.load{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-top:4px;min-width:70px}
.load i{display:block;height:100%;border-radius:3px}
.delta-up{color:var(--ok);font-weight:700} .delta-dn{color:var(--bad);font-weight:700}

/* ===== Floor hero — the signature moment ===== */
.hero{position:relative;background:linear-gradient(180deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-ink);border-radius:0 0 28px 28px;margin:-22px -20px 22px;padding:24px 28px 28px;display:grid;grid-template-columns:minmax(0,1.25fr) auto minmax(0,1fr);gap:26px;align-items:center;overflow:hidden}
.hero::after{content:"";position:absolute;left:28px;right:28px;bottom:14px;border-top:2px dashed rgba(245,165,36,.45)}
.hero .when{font-size:.88rem;color:var(--hero-dim);margin:0 0 6px}
.hero h1{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:clamp(1.9rem,3.6vw,3.1rem);line-height:1.08;margin:0 0 10px;letter-spacing:-.01em;color:var(--hero-ink)}
.hero h1 em{font-style:normal;color:var(--spool)}
.hero .vals{display:flex;flex-wrap:wrap;gap:6px}
.hero .vals span{border:1px solid var(--hero-3);border-radius:999px;padding:2px 11px;font-size:.8rem;color:var(--hero-dim)}
.gauge{position:relative;width:176px;height:176px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .c b{display:block;font-family:var(--display);font-size:2.6rem;font-weight:800;font-stretch:90%;line-height:1}
.gauge .c span{display:block;font-size:.78rem;color:var(--hero-dim);margin-top:4px}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hstats>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.hstats .l{font-size:.76rem;color:var(--hero-dim)}
.hstats .v{white-space:nowrap;font-family:var(--display);font-size:1.55rem;font-weight:800;font-stretch:95%;line-height:1.15;font-variant-numeric:tabular-nums}
.hstats .v.bad{color:#FF7A92} .hstats .v.ok{color:#5FE39B} .hstats .v.warn{color:var(--spool)}
@media (max-width:1000px){.hero{grid-template-columns:minmax(0,1fr) auto}.hstats{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.hero{grid-template-columns:minmax(0,1fr) auto;padding:16px 16px 30px;margin:-18px -16px 18px;gap:14px}.hero>div:first-child{grid-column:1/-1}.gauge{width:118px;height:118px;grid-row:2;grid-column:2}.gauge .c b{font-size:1.7rem}.gauge .c span{font-size:.68rem}.hstats{grid-row:2;grid-column:1;grid-template-columns:minmax(0,1fr);gap:8px}.hstats>div:nth-child(n+3){display:none}.hstats .v{font-size:1.25rem}}

.phead{background:linear-gradient(180deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-ink);margin:-22px -20px 22px;padding:14px 24px 24px;border-radius:0 0 24px 24px;position:relative}

.phead .f select{background:var(--hero-3);border-color:transparent;color:var(--hero-ink);color-scheme:dark}
.phead .seg{background:var(--hero-2);border-color:var(--hero-3)}
.phead .seg button{color:var(--hero-dim)}
.phead .seg button[aria-pressed="true"]{background:var(--spool);color:var(--spool-ink)}
@media (max-width:600px){.phead{margin:-18px -16px 18px;padding:12px 16px 22px}}
.switch{display:flex;align-items:center;gap:8px;min-height:38px;cursor:pointer;font-size:.86rem;color:var(--ink-2)}
.f .switch input,.switch input{min-height:0;padding:0;border:0;box-shadow:none;appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--idle);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}

.al:hover{border-color:var(--denim)} .al b{white-space:nowrap} .al span:last-child{color:var(--ink-2)}
.al.bad{border-left:4px solid var(--bad)} .al.warn{border-left:4px solid var(--warn)} .al.info{border-left:4px solid var(--denim)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center;background:var(--idle)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--denim)}
.pareto{display:grid;gap:8px}

.pb{height:16px;background:var(--panel-2);border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn));border-radius:5px}

.sw{text-align:center}

.btn.big{padding:12px 26px;font-size:1.02rem}

.samres{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:14px 16px;margin-top:14px}
.samres .l{font-size:.8rem;color:var(--hero-dim)} .samres .v{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1.1;color:var(--spool)} .samres .s{font-size:.8rem;color:var(--hero-dim)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
.tile{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:150px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}

.tile .seam i{flex:1;height:3px;border-radius:2px;background:var(--idle)}
.tile .seam i.ok{background:var(--ok)} .tile .seam i.warn{background:var(--warn)} .tile .seam i.bad{background:var(--bad)}
.tile .top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-top:2px}

.tile.ok .pct{background:var(--ok-bg);color:var(--ok)} .tile.warn .pct{background:var(--warn-bg);color:var(--warn)} .tile.bad .pct{background:var(--bad-bg);color:var(--bad)}

.tile .prog{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:4px 0 2px}
.tile .prog i{display:block;height:100%;border-radius:3px;background:var(--idle)}

.tile .mx b{color:var(--ink);font-weight:700}
.tile .iss{align-self:flex-start;margin-top:auto}
.board.intro .tile{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 14ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== Charts ===== */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;min-width:460px;height:auto}
.chart text{font-family:var(--body);fill:var(--ink-2);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.empty{padding:30px 16px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 14px}
.muted{color:var(--ink-3)} .small{font-size:.82rem}

.chip{border:1px solid var(--rule);border-radius:999px;padding:3px 11px;font-size:.82rem;background:var(--panel-2)}

.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.foot{max-width:1360px;margin:0 auto;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));color:var(--ink-3);font-size:.8rem}
.printhead{display:none}

body.tv .bar,body.tv .foot,body.tv .banner,body.tv .toolbar{display:none}
body.tv main{max-width:none;padding:0 22px 22px}

body.tv .board{grid-template-columns:repeat(6,minmax(0,1fr))}

.tvexit{display:none}

.clock{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--spool);font-variant-numeric:tabular-nums}

@media (max-width:600px){
  .bar-in{padding:10px 14px 0}

  .brand span:not(.logo){display:none}

  .tile{padding:14px 11px 10px;min-height:138px}

  .f.wide{grid-column:auto}
  h1.vh{font-size:1.55rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{

  .printhead b{font-size:1.3rem}
}

/* Greedy rebalance: give each operation half-person steps to the current bottleneck until the pool runs out. */
function suggestMp(procs, pool, step=0.5){
  const valid = procs.filter(p => num(p.sam) > 0);
  if (!valid.length || pool <= 0) return null;
  const alloc = {}; valid.forEach(p => alloc[p.id] = step);
  let left = pool - step * valid.length;
  if (left < 0) return null;
  while (left >= step - 1e-9) {
    let worst = null, wc = Infinity;
    valid.forEach(p => { const c = capOf(num(p.sam), alloc[p.id]); if (c < wc) { wc = c; worst = p; } });
    alloc[worst.id] += step; left -= step;
  }
  const minCap = Math.min(...valid.map(p => capOf(num(p.sam), alloc[p.id])));
  return {alloc, minCap};
}

  let start = h*60 + m + i*60; if (i >= 4) start += 60; // 1-hour lunch after the 4th hour
  const f = x => pad2(Math.floor(x/60)%24)+":"+pad2(x%60);

}

function lineHistory(n, data){

/* Order progress: output since the style started, pace, finish date and shipment risk */
function orderPlan(n, data){
  const l = getLine(n), id = lineId(n), qty = num(l.orderQty);
  if (!qty) return null;
  let made = 0, days = 0;
  Object.keys(data).forEach(dt => { if (l.styleStart && dt < l.styleStart) return; if (dt > S.date) return; const p = data[dt] && data[dt][id]; if (!p) return; const r = calcLine(l, p); if (r.logged) { made += r.out; days++; } });
  const today = calcLine(l, getProd(n));
  if (!(data[S.date] && data[S.date][id]) && today.logged) { made += today.out; days++; }
  const left = Math.max(0, qty - made);
  const pace = days ? made/days : calcLine(l, getProd(n)).targetDaily;
  const need = pace > 0 ? Math.ceil(left / pace) : null;
  const finish = need == null ? null : addWorkDays(S.date, need);
  const late = finish && l.shipDate ? Math.round((new Date(finish+"T12:00:00") - new Date(l.shipDate+"T12:00:00"))/864e5) : null;
  const daysToShip = l.shipDate ? workDaysBetween(S.date, l.shipDate) : null;
  const reqPace = daysToShip && daysToShip > 0 ? Math.ceil(left / daysToShip) : null;

/* Time study maths */
function studyStats(obs, rating, allow){
  const x = obs.map(num).filter(v => v > 0); const n = x.length;
  if (!n) return null;
  const sum = x.reduce((a,b)=>a+b,0), avg = sum/n, sq = x.reduce((a,b)=>a+b*b,0);
  const sd = n > 1 ? Math.sqrt(Math.max(0, (sq - n*avg*avg)/(n-1))) : 0;
  const nReq = n > 1 && sum > 0 ? Math.ceil(Math.pow(40*Math.sqrt(Math.max(0, n*sq - sum*sum))/sum, 2)) : null; // 95% confidence, ±5%
  const basic = avg * num(rating)/100; const sam = basic * (1 + num(allow)/100) / 60;
  return {n, avg, min:Math.min(...x), max:Math.max(...x), sd, cv: avg ? sd/avg*100 : 0, nReq, basic, sam};
}

let trendCache = {key:"", at:0, data:null};
async function loadTrend(){
  let data;
  if (trendCache.key === S.date && Date.now() - trendCache.at < 60000) data = trendCache.data;
  else { data = await Store.trend(7); trendCache = {key:S.date, at:Date.now(), data}; }
  const el = $("#trend"); if (!el) return;
  const days = Array.from({length:7},(_,i)=>addDays(S.date, i-6));
  const pts = days.map(d => {
    let sm=0, av=0; const day = data[d] || {};
    for (let n=1;n<=LINE_COUNT;n++){ const p = day[lineId(n)]; if (!p) continue; const r = calcLine(getLine(n), p); if (r.logged){ sm += r.out*r.smv; av += r.activeMp*(r.logged*60-r.npt); } }
    return av > 0 ? sm/av*100 : null;
  });
  if (pts.filter(v=>v!=null).length < 2) { el.textContent = t("trend_none"); return; }
  const W=720,H=200,L=36,B=24,T=12, max = Math.max(100, ...pts.filter(v=>v!=null))*1.05;
  const X = i => L + i*(W-L-16)/6, Y = v => T+(H-T-B)*(1-v/max);
  let s = `<svg width="${W}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("trend"))}">`;
  [0,50,100].forEach(v=>{ s += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}%</text>`; });
  let d = ""; pts.forEach((v,i)=>{ if (v==null) return; d += (d?"L":"M")+X(i)+" "+Y(v); });
  s += `<path d="${d}" fill="none" stroke="var(--denim)" stroke-width="2.5"/>`;
  pts.forEach((v,i)=>{ if (v!=null) s += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--denim)"/><text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmt(v,0)}%</text>`; s += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fmt(+days[i].slice(8))}/${fmt(+days[i].slice(5,7))}</text>`; });
  el.className = "chart"; el.innerHTML = s + `</svg>`;
}

/* ---------- Yamazumi / pitch diagram ---------- */
function yzLoss(r){ return r.balEff ? `<span class="tag ${r.balEff>=85?"ok":r.balEff>=70?"warn":"bad"}">${t("yz_loss",{v:fmt(100-r.balEff,1)})}</span>` : ""; }
function yamazumi(l, r){
  const items = r.procs.filter(x => num(x.p.sam) > 0 && num(x.p.mp) > 0).map((x,i) => ({x, i, v: num(x.p.sam)/num(x.p.mp)}));
  if (!items.length) return "";
  const pitch = r.sumMp > 0 ? r.sumSam / r.sumMp : 0;
  const takt = r.targetHourly > 0 ? 60 / r.targetHourly : 0;
  const ucl = pitch*1.15, lcl = pitch*0.85;
  const bw = 34, L = 44, R = 96, T = 14, B = 30, H = 250;
  const W = Math.max(560, L + R + items.length*bw);
  const max = Math.max(takt, ucl, ...items.map(o=>o.v)) * 1.12 || 1;
  const Y = v => T + (H-T-B)*(1 - v/max);
  let s = `<svg width="${W}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("yz_title"))}">`;
  [0, max/2/1.12, max/1.12].forEach(v => { s += `<line x1="${L}" x2="${W-R+10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v,2)}</text>`; });
  items.forEach((o,k) => {
    const x = L + k*bw + 5, w = bw-10;
    const col = takt && o.v > takt ? "bad" : o.v > ucl ? "warn" : o.v < lcl ? "denim" : "ok";
    s += `<rect x="${x}" y="${Y(o.v)}" width="${w}" height="${Y(0)-Y(o.v)}" rx="4" fill="var(--${col})" opacity="${col==="denim"?.55:1}"><title>${esc(o.x.p.name)}: ${fmt(o.v,3)} ${t("min")}</title></rect>`;
    s += `<text x="${x+w/2}" y="${H-12}" text-anchor="middle">${fmt(o.i+1)}</text>`;
  });
  const line = (v, col, dash, lab) => v ? `<line x1="${L}" x2="${W-R+10}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-width="${dash?1.5:2}" ${dash?`stroke-dasharray="${dash}"`:""}/><text x="${W-R+14}" y="${Y(v)+4}" style="fill:${col};font-weight:600">${lab} ${fmt(v,2)}</text>` : "";
  s += line(ucl, "var(--warn)", "3 4", "UCL") + line(lcl, "var(--ink-3)", "3 4", "LCL") + line(pitch, "var(--thread)", "", t("yz_pitch")) + line(takt, "var(--bad)", "7 4", t("yz_takt"));
  s += `</svg>`;
  return `<div class="chart">${s}</div><div class="legend"><span><i style="background:var(--bad)"></i>${t("yz_over")}</span><span><i style="background:var(--warn)"></i>${t("yz_high")}</span><span><i style="background:var(--ok)"></i>${t("yz_ok")}</span><span><i style="background:var(--denim);opacity:.55"></i>${t("yz_low")}</span><span><i style="background:var(--thread)"></i>${t("yz_pitch")}</span><span><i style="background:var(--bad)"></i>${t("yz_takt")}</span></div>`;
}

/* ---------- Learning curve ---------- */
function curvePanel(l, r){
  const c = CURVES[l.complexity || "medium"], tgt = num(l.targetEff);
  const days = c.length + 1, W = 520, H = 170, L = 34, B = 26, T = 18, bw = (W-L-6)/days;
  const val = d => d <= c.length ? Math.min(tgt, c[d-1]*tgt/80) : tgt;
  const Y = v => T + (H-T-B)*(1 - v/100);
  let s = `<svg width="${W}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("lc_title"))}">`;
  [0,50,100].forEach(v => { s += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}%</text>`; });
  for (let d=1; d<=days; d++){
    const v = val(d), x = L + (d-1)*bw + bw*0.15, w = bw*0.7, cur = l.curve && r.runDay === d || (l.curve && d === days && r.runDay > days);
    s += `<rect x="${x}" y="${Y(v)}" width="${w}" height="${Y(0)-Y(v)}" rx="4" fill="var(--${cur?"spool":"denim"})" opacity="${cur?1:.45}"/><text x="${x+w/2}" y="${Y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmt(v,0)}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${d===days?fmt(d)+"+":fmt(d)}</text>`;
  }
  s += `</svg>`;
  return `<p class="small muted" style="margin:-4px 0 8px">${l.curve && r.runDay ? t("lc_sub",{d:fmt(r.runDay),e:fmt(r.effPlan,0)}) : t("lc_off")}</p><div class="chart">${s}</div>`;
}

  const rank = {bad:0, warn:1, info:2}, by = {};
  raw.forEach(x => { const g = by[x.n] || (by[x.n] = {n:x.n, lv:x.lv, msgs:[]}); if (rank[x.lv] < rank[g.lv]) g.lv = x.lv; g.msgs.push(x); });
  const groups = Object.values(by).map(g => ({...g, msgs: g.lv === "info" ? g.msgs : g.msgs.filter(m => m.lv !== "info")})).sort((a,b) => rank[a.lv]-rank[b.lv] || b.msgs.length-a.msgs.length || a.n-b.n);
  const cnt = {bad:0,warn:0,info:0}; groups.forEach(g => cnt[g.lv]++);
  return `<section class="alerts noprint"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">${t("al_title")}</h2>
    ${cnt.bad?`<span class="tag bad">${fmt(cnt.bad)}</span>`:""}${cnt.warn?`<span class="tag warn">${fmt(cnt.warn)}</span>`:""}${cnt.info?`<span class="tag idle">${fmt(cnt.info)}</span>`:""}</div>
    <div class="alist">${groups.map(g => `<button type="button" class="al ${g.lv}" data-act="openline" data-n="${g.n}"><span class="dot ${g.lv}"></span><b>${t("line")} ${fmt(g.n)}</b><span>${g.msgs.map(m => esc(t(m.k, m.v))).join("<br>")}</span></button>`).join("")}</div></section>`;
}

/* ---------- Pareto of downtime/problems + costing (report) ---------- */
function paretoPanel(){
  const agg = {}; let total = 0;
  for (let n=1;n<=LINE_COUNT;n++){
    const r = calcLine(getLine(n), getProd(n));
    (getProd(n).hours||[]).forEach(h => {
      if (!h || (!h.p && !num(h.n))) return;
      const k = h.p || "_none"; const a = agg[k] || (agg[k] = {min:0, cnt:0, mm:0});
      a.min += num(h.n); a.cnt++; a.mm += num(h.n) * r.activeMp; total += num(h.n);
    });
  }
  const rows = Object.entries(agg).sort((a,b) => (b[1].min - a[1].min) || (b[1].cnt - a[1].cnt));
  let s = `<section class="panel"><h2>${t("pa_title")}</h2><p class="small muted" style="margin-top:-4px">${t("pa_sub")}</p>`;
  if (!rows.length) return s + `<p class="muted">${t("pa_none")}</p></section>`;
  const max = Math.max(...rows.map(r=>r[1].min), 1); let cum = 0; const cpm = num(S.settings.cpm);
  s += `<div class="pareto">` + rows.map(([k,a]) => { cum += a.min; const pc = total ? cum/total*100 : 0;
    return `<div class="pr"><span class="pl">${k==="_none"?t("pa_noreason"):t("pt_"+k)}</span><span class="pb"><i style="width:${a.min/max*100}%"></i></span><span class="pv num"><b>${fmt(a.min)}</b> ${t("pa_min")}, ${fmt(a.cnt)} ${t("pa_cnt")}</span><span class="pc num">${total?fmt(pc,0)+"%":"–"}${cpm&&a.mm?`<small>${t("pa_cost",{v:fmt(a.mm*cpm)})}</small>`:""}</span></div>`; }).join("") + `</div>`;
  return s + `</section>`;
}
function costPanel(){
  const cpm = num(S.settings.cpm); let lost = 0, earned = 0;
  for (let n=1;n<=LINE_COUNT;n++){ const r = calcLine(getLine(n), getProd(n)); if (!r.logged) continue;
    const avail = r.activeMp*(r.logged*60 - r.npt), e = r.out*r.smv; earned += e; lost += Math.max(0, avail*r.effPlan/100 - e); }
  return `<section class="panel"><h2>${t("cost_title")}</h2><p class="small muted" style="margin-top:-4px">${t("cpm_sub")}</p>
    <div class="row" style="align-items:flex-end"><div class="f" style="width:200px"><label for="cpmIn">${t("cpm")}</label><input id="cpmIn" type="number" min="0" step="0.01" data-set="cpm" value="${cpm||""}" ${S.canEdit?"":"disabled"}></div>
    ${cpm?`<div class="kpis" style="flex:1;min-width:260px"><div class="kpi ${lost>0?"bad":"ok"}"><div class="l">${t("cost_loss")}</div><div class="v">৳${fmt(lost*cpm)}</div><div class="s">${fmt(lost)} ${t("min")}</div></div></div>`:""}</div></section>`;
}

const PW = 1100, PH = Math.round(1100*210/297), PAD = 26, FOOT = 22;
function paginate(items, box){
  const avail = PH - PAD*2 - FOOT, pages = []; let cur = [], used = 0;
  const flush = () => { if (cur.length) pages.push(cur); cur = []; used = 0; };
  const measure = html => { box.innerHTML = `<div style="display:flow-root">${html}</div>`; return box.firstElementChild.getBoundingClientRect().height; };
  items.forEach(it => {
    if (it.kind === "block") { const h = measure(it.html) + 12; if (used && used + h > avail) flush(); cur.push(it.html); used += h; return; }
    const titleH = measure(pSec(it.title, it.sub, "")) + 4, contH = measure(`<section class="psec"><h2 class="cont">${esc(it.title)}</h2></section>`) + 4;
    box.innerHTML = `<table class="pt"><thead>${it.head}</thead><tbody>${it.rows.join("") || `<tr><td>${esc(it.empty||"")}</td></tr>`}</tbody></table>`;
    const tb = box.firstElementChild, headH = tb.tHead.getBoundingClientRect().height, rowH = Array.from(tb.tBodies[0].rows).map(r => r.getBoundingClientRect().height);
    const rowsHtml = it.rows.length ? it.rows : [`<tr><td colspan="20" style="color:${PC.ink3}">${esc(it.empty||"")}</td></tr>`];
    let i = 0, first = true;
    while (i < rowsHtml.length) {
      const minRows = Math.min(3, rowsHtml.length - i);
      const need = (first ? titleH : contH) + headH + rowH.slice(i, i+minRows).reduce((a,b)=>a+b,0) + 12;
      if (used && used + need > avail) flush();
      let chunk = [], h = (first ? titleH : contH) + headH + 12;
      while (i < rowsHtml.length && (chunk.length === 0 || used + h + rowH[i] <= avail)) { chunk.push(rowsHtml[i]); h += rowH[i]; i++; }
      cur.push(`<section class="psec">${first ? `<h2>${esc(it.title)}</h2>${it.sub?`<p class="psub">${esc(it.sub)}</p>`:""}` : `<h2 class="cont">${esc(it.title)} ${t("pdf_cont")}</h2>`}<table class="pt"><thead>${it.head}</thead><tbody>${chunk.join("")}</tbody></table></section>`);
      used += h; first = false;
      if (i < rowsHtml.length) flush();
    }
  });
  flush();
  return pages;
}

    const q = p.q || (p.q = {});
    if (el.dataset.qf === "def") { q.def = q.def || [{},{},{}]; while (q.def.length < 3) q.def.push({}); const d = q.def[+el.dataset.k] || (q.def[+el.dataset.k] = {}); d[el.dataset.sub] = el.dataset.sub === "c" ? (el.value===""?"":num(el.value)) : el.value; }
    else q[el.dataset.qf] = el.value;
    Store.saveProd(n); return;
  }
  if (el.dataset.of || el.dataset.sk) {
    const oid = el.closest("tr").dataset.oid, o = S.operators[oid]; if (!o) return;
    if (el.dataset.sk) { o.skills = o.skills || {}; if (el.value === "") delete o.skills[el.dataset.sk]; else o.skills[el.dataset.sk] = num(el.value); }
    else { o[el.dataset.of] = el.value; if (el.dataset.of === "line") o.proc = ""; }
    Store.saveOp(oid);
  }
});
V.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act;
  if (act === "selline") { S.lineNo = +el.value; lsSet("ielb.line", S.lineNo); render(); }
  else if (act === "ts_proc") { S.ts.pid = el.value; tsFromSaved(); render(); }
  else if (act === "qhour") { S.quickHour = +el.value; render(); }
  else if (act === "opsline") { S.opsLine = el.value; render(); }
  else if (el.dataset.of === "line" || el.dataset.of === "proc") { el.blur(); render(); }
  else if (el.dataset.lf === "floor") { el.blur(); }
});
V.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const act = b.dataset.act, l = getLine(S.lineNo);
  if (act.startsWith("ts_")) { tsAction(act, b); return; }
  switch (act) {
    case "tv": setTV(true); break;
    case "pdf": exportFullPdf(b); break;
    case "ffilter": S.floorFilter = b.dataset.v; render(); break;
    case "openline": S.lineNo = +b.dataset.n; lsSet("ielb.line", S.lineNo); S.hourlyMode = "one"; go("hourly"); break;
    case "hmode": S.hourlyMode = b.dataset.v; render(); break;
    case "addproc": l.processes.push({id:uid(), name:S.lang==="bn"?"নতুন অপারেশন":"New operation", machine:"SNLS", sam:0.8, mp:1}); Store.saveLine(S.lineNo); render(); break;
    case "delproc": l.processes = l.processes.filter(p => p.id !== b.dataset.pid); Store.saveLine(S.lineNo); render(); break;
    case "sampleob": l.processes = SAMPLE_OB.map(p => ({...p, id:uid()})); if (!num(l.smv)) { l.smv = 14.5; l.op = l.op||28; l.hp = l.hp||6; } Store.saveLine(S.lineNo); render(); break;
    case "applysug": { const r = calcLine(l, getProd(S.lineNo)), s = suggestMp(l.processes, r.sumMp); if (s) { l.processes.forEach(p => { if (s.alloc[p.id] != null) p.mp = s.alloc[p.id]; }); Store.saveLine(S.lineNo); render(); toast(t("applied")); } break; }
    case "importob": pickFile(rows => { const ob = parseOB(rows); if (!ob) return toast(t("import_fail")); l.processes = ob; if (!num(l.smv)) l.smv = Math.round(ob.reduce((a,p)=>a+p.sam,0)*100)/100; Store.saveLine(S.lineNo); render(); toast(t("imported",{n:fmt(ob.length)})); }); break;
    case "exportob": saveSheets(`BGL_OB_Line${pad2(S.lineNo)}_${(l.style||"style").replace(/[^\w\-]+/g,"_")}.xlsx`, [["OB", obRows(l)]]); break;
    case "savetpl": { const id = uid(); S.templates[id] = {buyer:l.buyer, style:l.style || (t("line")+" "+S.lineNo), smv:num(l.smv), processes:clone(l.processes), updated:new Date().toISOString()}; Store.saveTpl(id); toast(t("tpl_saved")); break; }
    case "ai": runAI(); break;
    case "addop": { const id = uid(); S.operators[id] = {code:"", name:"", line: S.opsLine==="all" ? lineId(S.lineNo) : lineId(+S.opsLine), proc:"", skills:{}}; Store.saveOp(id); render(); const inp = $(`tr[data-oid="${id}"] input[data-of="code"]`); if (inp) inp.focus(); break; }
    case "delop": if (await confirmBox(t("confirm_del"))) { delete S.operators[b.dataset.oid]; Store.saveOp(b.dataset.oid); render(); } break;
    case "exportops": { const mcs = opMachines(); const rows = [[t("o_code"), t("o_name"), t("o_line"), t("o_proc"), ...mcs]];
      Object.values(S.operators).filter(o => S.opsLine==="all" || o.line===lineId(+S.opsLine)).forEach(o => { const ln = o.line?+o.line.slice(1):0; const p = ln ? getLine(ln).processes.find(x=>x.id===o.proc) : null; rows.push([o.code, o.name, ln||"", p?p.name:"", ...mcs.map(m => (o.skills||{})[m] ?? "")]); });
      saveSheets("BGL_Skill_matrix.xlsx", [["Skills", rows]]); break; }
    case "importops": pickFile(rows => {
      const f = findCols(rows, {name:["name","নাম"], sam:["card","code","id","কার্ড"], line:["line","লাইন"]});
      if (!f) return toast(t("import_fail"));
      const hdr = rows[f.row].map(String), mcs = opMachines(); let c = 0;
      for (let r=f.row+1; r<rows.length; r++){ const row = rows[r]; const name = String(row[f.idx.name]||"").trim(); if (!name) continue;
        const skills = {}; hdr.forEach((hh,ci) => { const m = mcs.find(x => x.toLowerCase() === hh.trim().toLowerCase()); if (m && row[ci] !== "") skills[m] = num(row[ci]); });
        const ln = f.idx.line>=0 ? parseInt(row[f.idx.line]) : (S.opsLine==="all"?S.lineNo:+S.opsLine);
        const id = uid(); S.operators[id] = {code:String(row[f.idx.sam]||""), name, line: ln>=1&&ln<=LINE_COUNT?lineId(ln):"", proc:"", skills}; Store.saveOp(id); c++; }
      render(); toast(t("imported",{n:fmt(c)})); }); break;
    case "importtpl": pickFile((rows, fname) => { const ob = parseOB(rows); if (!ob) return toast(t("import_fail")); const id = uid(); S.templates[id] = {buyer:"", style:fname.replace(/\.\w+$/,""), smv:Math.round(ob.reduce((a,p)=>a+p.sam,0)*100)/100, processes:ob, updated:new Date().toISOString()}; Store.saveTpl(id); render(); toast(t("imported",{n:fmt(ob.length)})); }); break;
    case "applytpl": { const tp = S.templates[b.dataset.tid]; const n = +b.closest("tr").querySelector("[data-tline]").value; const tl = getLine(n);
      tl.processes = (tp.processes||[]).map(p => ({...p, id:uid()})); tl.buyer = tp.buyer || tl.buyer; tl.style = tp.style || tl.style; tl.smv = num(tp.smv) || Math.round(tl.processes.reduce((a,p)=>a+num(p.sam),0)*100)/100;
      Store.saveLine(n); S.lineNo = n; lsSet("ielb.line", n); toast(t("tpl_applied")); go("line"); break; }
    case "exporttpl": { const tp = S.templates[b.dataset.tid]; saveSheets(`BGL_OB_${(tp.style||"style").replace(/[^\w\-]+/g,"_")}.xlsx`, [["OB", [[t("c_no"),t("c_op"),t("c_mc"),"SAM","MP"], ...(tp.processes||[]).map((p,i)=>[i+1,p.name,p.machine,num(p.sam),num(p.mp)])]]]); break; }
    case "deltpl": if (await confirmBox(t("confirm_del"))) { delete S.templates[b.dataset.tid]; Store.saveTpl(b.dataset.tid); render(); } break;
    case "exportrep": { const rows = [[t("line"), t("buyer"), t("style"), "SMV", t("k_mp"), t("k_hourly"), t("hrs_logged",{n:""}).trim(), t("s_target"), t("out"), t("r_var"), t("eff")+" %", "DHU %", t("h_npt"), t("fc_title"), t("k_daily"), t("r_bneck"), t("k_bneck"), t("k_bal")+" %"]];
      reportRows().forEach(({n,l,r}) => rows.push([n, l.buyer, l.style, r.smv, r.activeMp, r.targetHourly, r.logged, r.tgtSoFar, r.out, r.out-r.tgtSoFar, r.eff==null?"":Math.round(r.eff*10)/10, r.dhu==null?"":Math.round(r.dhu*10)/10, r.npt, r.forecast??"", r.targetDaily, r.bn?r.bn.name:"", Math.round(r.minCap), Math.round(r.balEff*10)/10]));
      const hourly = [[t("line"), ...Array.from({length:12},(_,i)=>t("hour_n",{n:i+1}))]];
      reportRows().forEach(({n}) => hourly.push([n, ...Array.from({length:12},(_,i)=>{ const h=(getProd(n).hours||[])[i]; return h&&h.o!==""?h.o:""; })]));
      const iss = [[t("line"), t("h_hour"), t("h_prob"), t("h_action"), t("h_who"), t("h_tts"), t("h_status")]];
      for (let n=1;n<=LINE_COUNT;n++) (getProd(n).hours||[]).forEach((h,i) => { if (h && h.p) iss.push([n, i+1, t("pt_"+h.p), h.r||"", h.w||"", h.tm||"", h.s==="done"?t("st_done"):t("st_pending")]); });
      const ql = [[t("line"), "DHU %", t("dhuTarget"), t("q_defects"), t("q_audit"), t("q_feedback")]];
      reportRows().forEach(({n,r}) => { const q = getProd(n).q || {}; ql.push([n, r.dhu==null?"":Math.round(r.dhu*10)/10, r.dhuT, (q.def||[]).filter(d=>d&&d.n).map(d=>d.n+" ("+(d.c||0)+")").join(", "), q.audit||"", q.fb||""]); });
      saveSheets(`BGL_IE_Report_${S.date}.xlsx`, [["Summary", rows], ["Hourly", hourly], ["Action tracker", iss], ["Quality", ql]]); break; }
    case "wafloor": copyText(waFloor()); break;
    case "print": window.print(); break;
    case "backup": { const b = {app:"ie-line-balancer", version:1, exported:new Date().toISOString(), lines:S.lines, operators:S.operators, templates:S.templates, prod: await Store.allProd()};
      saveFile(`BGL_IE_backup_${S.date}.json`, new Blob([JSON.stringify(b)], {type:"application/json"})); break; }
    case "restore": pickJson(async b => {
      if (!b || b.app !== "ie-line-balancer" || !b.lines) return toast(t("restore_fail"));
      if (!(await confirmBox(t("restore_confirm")))) return;
      try { await Store.restore(b); trendCache = {key:"",at:0,data:null}; render(); toast(t("restored")); } catch(err){ console.warn(err); toast(err && err.code==="quota_exceeded" ? t("quota") : t("restore_fail")); } }); break;
  }
});

}

$("#dateSel").addEventListener("change", e => { if (!e.target.value) return; if (S.mode==="local") Store.persistLocal(); S.date = e.target.value; Store.subscribeProd(); render(); });
let tvTimer = null;
function setTV(on){
  document.body.classList.toggle("tv", on);
  if (on) { try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); } catch(e){}
    const tick = () => { const c = $("#clock"); if (c) c.textContent = new Date().toLocaleTimeString(S.lang==="bn"?"bn-BD":"en-GB",{hour:"2-digit",minute:"2-digit"}); };
    let k = 0;
    clearInterval(tvTimer); tvTimer = setInterval(() => { tick(); if (++k % 15 === 0) { // every 15 s show the next floor
      const heads = $$(".floorhead"); if (!heads.length) return; const cur = heads.findIndex(x => x.getBoundingClientRect().top > 40); const nx = heads[(cur < 0 ? 0 : cur)] ;
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) window.scrollTo({top:0, behavior:"smooth"}); else nx.scrollIntoView({behavior:"smooth", block:"start"}); } }, 1000);
    if (S.view !== "floor") go("floor"); else render();
    setTimeout(tick, 0);
  } else { clearInterval(tvTimer); try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){} render(); }
}
$("#tvExit").addEventListener("click", () => setTV(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("tv")) setTV(false); });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("tv")) setTV(false); });
function go(v){ if (location.hash === "#"+v) route(); else location.hash = "#"+v; }
function route(){ const h = location.hash.replace("#",""); S.view = VIEWS.includes(h) ? h : "floor"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);

(async function init(){
  const h = location.hash.replace("#",""); S.view = VIEWS.includes(h) ? h : "floor";
  renderChrome(); render();
  await Store.init();
  render();

    window.claude.use("downloads").then(d => { downloadsNs = d; }).catch(()=>{});
    window.claude.use("sample").then(s => { if (s) { window.__sample = s; if (S.view === "line") scheduleRender(); } }).catch(()=>{});
  } } catch(e){}
})();
