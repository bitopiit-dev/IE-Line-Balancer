<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IE Line Balancer | Baridhi Garments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F6F8FB; --ink:#1B2333; --ink-2:#4A5568; --ink-3:#7A8699;
  --rule:#D5DBE4; --denim:#27477A; --denim-2:#E3EAF5; --thread:#0F7B78;
  --ok:#1F7A4D; --ok-bg:#E2F3EA; --warn:#A86A0C; --warn-bg:#FBF0DC; --bad:#B42318; --bad-bg:#FBE4E1;
  --idle:#CBD2DC; --focus:#3B82F6;
  --radius-s:6px; --radius:10px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --panel:#182030; --panel-2:#1E2839; --ink:#E7ECF3; --ink-2:#B3BDCB; --ink-3:#8592A6;
    --rule:#2C384C; --denim:#8FB1E8; --denim-2:#22324D; --thread:#46C2BD;
    --ok:#52C489; --ok-bg:#163527; --warn:#E5AE4E; --warn-bg:#3A2D14; --bad:#F07A6E; --bad-bg:#3D1C1A;
    --idle:#3A475C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --panel:#182030; --panel-2:#1E2839; --ink:#E7ECF3; --ink-2:#B3BDCB; --ink-3:#8592A6;
  --rule:#2C384C; --denim:#8FB1E8; --denim-2:#22324D; --thread:#46C2BD;
  --ok:#52C489; --ok-bg:#163527; --warn:#E5AE4E; --warn-bg:#3A2D14; --bad:#F07A6E; --bad-bg:#3D1C1A;
  --idle:#3A475C; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Nirmala UI","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:.8rem;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--idle);display:inline-block}
.sync.cloud i{background:var(--ok)} .sync.local i{background:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--denim);color:var(--panel);font-weight:600}
input[type=date].dt{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--panel);font-size:.85rem}
nav.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 14px 10px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--denim);border-bottom-color:var(--denim);font-weight:700}

main{max-width:1320px;margin:0 auto;padding:18px 16px 60px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius-s);padding:8px 12px;font-size:.88rem;margin-bottom:14px}
.banner.info{background:var(--denim-2);color:var(--denim)}
h1.vh{font-size:1.5rem;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.vsub{color:var(--ink-3);margin:0 0 16px;font-size:.92rem}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;margin-bottom:16px;min-width:0}
.panel.flat{background:var(--panel-2)}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius-s);padding:6px 12px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--denim);border-color:var(--denim);color:var(--panel);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--denim)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:.82rem}

/* fields */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 12px}
.f label{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:3px;font-weight:500}
.f input,.f select{width:100%;border:1px solid var(--rule);border-radius:var(--radius-s);padding:6px 9px;background:var(--panel);min-height:36px}
.f input:disabled,.f select:disabled{background:var(--panel-2);color:var(--ink-2)}
.f.wide{grid-column:span 2}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel-2);border-radius:var(--radius-s);padding:10px 12px;border-left:4px solid var(--denim)}
.kpi .l{font-size:.8rem;color:var(--ink-2)}
.kpi .v{font-size:1.45rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--ink-3)}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)}

.note{border-radius:var(--radius-s);padding:10px 12px;font-size:.92rem;margin-top:12px}
.note.ok{background:var(--ok-bg);color:var(--ok)} .note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)}
.note b{font-weight:700}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius-s)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:var(--panel-2);text-align:left;font-weight:600;color:var(--ink-2);font-size:.8rem;padding:8px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input,td select{width:100%;min-width:60px;border:1px solid transparent;border-radius:4px;padding:4px 6px;background:transparent}
td input:not(:disabled){border-bottom:1px dashed var(--rule)}
td input:hover:not(:disabled),td select:hover:not(:disabled){border-color:var(--rule)}
td input:focus{border-color:var(--focus);background:var(--panel)}
td.r,th.r{text-align:right}
tr.hot td{background:var(--bad-bg)}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.idle{background:var(--panel-2);color:var(--ink-3)}
.load{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-top:3px;min-width:70px}
.load i{display:block;height:100%}
.delta-up{color:var(--ok);font-weight:700} .delta-dn{color:var(--bad);font-weight:700}

/* floor board — the signature element */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.summary>div{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -1px -1px 0}
.summary .l{font-size:.8rem;color:var(--ink-2)}
.summary .v{font-size:1.6rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.floorhead{display:flex;align-items:baseline;gap:12px;margin:18px 0 8px}
.floorhead h2{margin:0}
.floorhead span{color:var(--ink-3);font-size:.85rem}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px 10px;cursor:pointer;text-align:left;position:relative;display:flex;flex-direction:column;gap:4px;min-height:132px}
.tile:hover{border-color:var(--denim)}
.tile .top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tile .ln{font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .st{font-size:.78rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mx{display:flex;flex-wrap:wrap;gap:0 10px;justify-content:space-between;font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile .mx b{color:var(--ink);font-weight:700}
.tile::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--idle)}
.tile.ok::before{background:var(--ok)} .tile.warn::before{background:var(--warn)} .tile.bad::before{background:var(--bad)}
.ticks{display:flex;gap:2px;margin-top:auto;height:22px;align-items:flex-end}
.ticks i{flex:1;background:var(--idle);border-radius:2px;min-height:3px}
.ticks i.ok{background:var(--ok)} .ticks i.warn{background:var(--warn)} .ticks i.bad{background:var(--bad)}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;min-width:460px;height:auto}
.chart text{font-family:inherit;fill:var(--ink-2);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 12px}
.muted{color:var(--ink-3)} .small{font-size:.82rem}
.ai-out{white-space:pre-wrap;background:var(--panel-2);border-radius:var(--radius-s);padding:12px;margin-top:10px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:.82rem;background:var(--panel)}
dialog{border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel);color:var(--ink);padding:18px;max-width:min(520px,92vw)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hide{display:none!important}
@media (max-width:600px){
  .summary{grid-template-columns:repeat(3,minmax(0,1fr))}
  .summary>div{padding:10px}
  .brand span{display:none}
  .summary .v{font-size:1.3rem}
  .tile .ln{font-size:1.6rem}
  .f.wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .bar,.noprint,.btn{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .panel{border:1px solid #bbb;break-inside:avoid}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><b id="brandName">IE Line Balancer</b><span id="brandSub"></span></div>
    <div class="bar-tools">
      <span class="sync" id="sync"><i></i><span id="syncTxt"></span></span>
      <input type="date" class="dt" id="dateSel" aria-label="Date">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="bn" aria-pressed="true">বাংলা</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" class="hide">
<script>

  ro_banner:"আপনি শুধু দেখতে পারবেন। লাইন সেটআপ বদলাতে মালিকের কাছে Editor, আর আওয়ারলি এন্ট্রির জন্য Contributor অ্যাক্সেস চান।",

  s_target:"টার্গেট (এ পর্যন্ত)", s_output:"আউটপুট", s_eff:"ফ্লোর এফিশিয়েন্সি", s_dhu:"DHU", s_running:"চালু লাইন", s_behind:"পিছিয়ে আছে",
  f_all:"সব লাইন", f_behind:"শুধু পিছিয়ে থাকা", f_idle:"সেটআপ বাকি",
  not_setup:"সেটআপ বাকি", no_data:"এন্ট্রি নেই",
  eff:"এফিশিয়েন্সি", out:"আউটপুট", tgt:"টার্গেট", ach:"অর্জন",
  pcs:"পিস", pcs_hr:"পিস/ঘণ্টা", persons:"জন", sec:"সেকেন্ড", min:"মিনিট",
  line_setup:"লাইন সেটআপ", choose_line:"লাইন বাছাই করুন",
  k_daily:"দৈনিক টার্গেট", k_hourly:"ঘণ্টার টার্গেট", k_bneck:"বটলনেক ক্যাপাসিটি", k_bal:"ব্যালেন্স এফিশিয়েন্সি", k_takt:"ট্যাক্ট টাইম", k_mp:"সক্রিয় জনবল", k_theo:"থিওরেটিক্যাল জনবল",
  cap100:"১০০% এ", at_target:"টার্গেট এফিশিয়েন্সিতে",

  add_proc:"প্রসেস যোগ করুন", del:"মুছুন", sample_ob:"নমুনা OB লোড করুন", import_ob:"Excel থেকে OB আনুন", export_ob:"OB Excel এ নিন", save_tpl:"স্টাইল লাইব্রেরিতে সেভ",
  no_proc:"এই লাইনে এখনো কোনো প্রসেস নেই। স্টাইলের OB যোগ করলে বটলনেক আর ব্যালেন্স হিসাব শুরু হবে।",
  bneck:"বটলনেক", balanced:"ব্যালেন্সড", normal:"স্বাভাবিক", over:"অতিরিক্ত লোড",
  chart_cap:"প্রসেস অনুযায়ী ঘণ্টায় ক্ষমতা বনাম টার্গেট",
  lg_cap:"ক্ষমতা", lg_bn:"বটলনেক", lg_tgt:"ঘণ্টার টার্গেট",
  auto_title:"অটো ব্যালেন্সিং পরামর্শ",
  auto_same:"একই জনবল ({mp} জন) দিয়ে পুনর্বিন্যাস করলে বটলনেক {from} থেকে {to} পিস/ঘণ্টা হবে।",
  auto_none:"বর্তমান বিন্যাসই এই জনবলে সবচেয়ে ভালো।",

const clone = o => JSON.parse(JSON.stringify(o || {}));

/* ---------- IE calculations ---------- */
function capOf(sam, mp){ return sam > 0 ? (60 / sam) * mp : 0; }
function skillMpOf(line, proc){
  const ops = Object.values(S.operators).filter(o => o.line === lineId(line.no) && o.proc === proc.id);
  if (!ops.length) return null;
  // recorded operators count at their skill; any remaining seats on this operation count at 100%
  return ops.reduce((a,o) => a + num((o.skills||{})[proc.machine] ?? 60)/100, 0) + Math.max(0, num(proc.mp) - ops.length);
}
function calcLine(line, prod){
  const r = {};
  const raw = num(line.op) + num(line.hp);
  r.activeMp = raw > 0 ? Math.max(1, Math.round(raw * (1 - num(line.absent)/100))) : 0;
  r.hours = num(line.hours) || 10; r.smv = num(line.smv);
  r.cap100Daily = r.smv > 0 ? Math.floor(r.activeMp * r.hours * 60 / r.smv) : 0;
  r.targetDaily = Math.floor(r.cap100Daily * num(line.targetEff)/100);
  r.cap100Hourly = Math.round(r.cap100Daily / r.hours);
  r.targetHourly = Math.round(r.targetDaily / r.hours);
  r.takt = r.targetHourly > 0 ? 3600 / r.targetHourly : 0;
  r.setup = r.smv > 0 && r.activeMp > 0;
  // processes
  let minCap = Infinity, bn = null, sumSam = 0, sumMp = 0;
  r.procs = (line.processes || []).map(p => {
    const cap = capOf(num(p.sam), num(p.mp));
    const smp = skillMpOf(line, p);
    const scap = smp == null ? null : capOf(num(p.sam), smp);
    const eff = scap == null ? cap : scap;
    sumSam += num(p.sam); sumMp += num(p.mp);
    if (num(p.sam) > 0 && eff < minCap) { minCap = eff; bn = p; }
    return {p, cap, scap, eff, load: eff > 0 && r.targetHourly > 0 ? r.targetHourly/eff*100 : 0};
  });
  r.minCap = minCap === Infinity ? 0 : minCap; r.bn = bn; r.sumSam = sumSam; r.sumMp = sumMp;
  r.balEff = sumMp > 0 && r.minCap > 0 ? Math.min(100, sumSam * r.minCap / (sumMp * 60) * 100) : 0;
  r.theoMp = sumSam * r.targetHourly / 60;
  // production
  const hrs = (prod && prod.hours) || [];
  let out = 0, def = 0, npt = 0, logged = 0, lastIdx = -1;
  hrs.forEach((h, i) => { if (h && h.o !== "" && h.o != null) { out += num(h.o); def += num(h.d); npt += num(h.n); logged++; lastIdx = i; } });
  r.out = out; r.def = def; r.npt = npt; r.logged = logged; r.lastIdx = lastIdx;
  const avail = r.activeMp * (logged * 60 - npt);
  r.eff = avail > 0 && r.smv > 0 ? out * r.smv / avail * 100 : null;
  r.tgtSoFar = r.targetHourly * logged;
  r.ach = r.tgtSoFar > 0 ? out / r.tgtSoFar * 100 : null;
  r.dhu = out > 0 ? def / out * 100 : null;
  r.forecast = logged > 0 ? Math.round(out / logged * r.hours) : null;
  r.status = r.ach == null ? "idle" : r.ach >= 95 ? "ok" : r.ach >= 85 ? "warn" : "bad";
  return r;
}
function hourStatus(o, target){ if (o == null || o === "") return ""; const a = target > 0 ? num(o)/target*100 : 100; return a >= 95 ? "ok" : a >= 85 ? "warn" : "bad"; }
/* Greedy rebalance: give each operation half-person steps to the current bottleneck until the pool runs out. */
function suggestMp(procs, pool, step=0.5){
  const valid = procs.filter(p => num(p.sam) > 0);
  if (!valid.length || pool <= 0) return null;
  const alloc = {}; valid.forEach(p => alloc[p.id] = step);
  let left = pool - step * valid.length;
  if (left < 0) return null;
  while (left >= step - 1e-9) {
    let worst = null, wc = Infinity;
    valid.forEach(p => { const c = capOf(num(p.sam), alloc[p.id]); if (c < wc) { wc = c; worst = p; } });
    alloc[worst.id] += step; left -= step;
  }
  const minCap = Math.min(...valid.map(p => capOf(num(p.sam), alloc[p.id])));
  return {alloc, minCap};
}
function needMp(procs, targetHourly){ return procs.reduce((a,p) => a + (num(p.sam) > 0 ? Math.ceil(num(p.sam) * targetHourly / 60 * 2)/2 : 0), 0); }
function shiftClock(line, i){
  const [h,m] = String(line.shift || "08:00").split(":").map(x => parseInt(x)||0);
  let start = h*60 + m + i*60; if (i >= 4) start += 60; // 1-hour lunch after the 4th hour

}

  let h = `<div class="grid2"><section class="panel"><h2>${t("chart_cap")}</h2>${capChart(r)}</section><section class="panel"><h2>${t("auto_title")}</h2>`;
  const sug = suggestMp(l.processes, r.sumMp);
  if (sug) {
    const better = sug.minCap > r.procs.reduce((m,x)=>Math.min(m,x.cap),Infinity) + 0.5;
    h += better ? `<p>${t("auto_same",{mp:fmt(r.sumMp,1),from:fmt(Math.min(...r.procs.filter(x=>num(x.p.sam)>0).map(x=>x.cap))),to:fmt(sug.minCap)})}</p>${S.canEdit?`<button class="btn pri" data-act="applysug">${t("apply")}</button>`:""}` : `<p>${t("auto_none")}</p>`;
  }
  if (r.targetHourly > 0) h += `<p class="small muted" style="margin-top:12px">${t("auto_need",{t:fmt(r.targetHourly),n:fmt(needMp(l.processes, r.targetHourly),1),c:fmt(r.sumMp,1)})}</p>`;
  // best operators for bottleneck
  if (r.bn) {
    const lid = lineId(l.no), mc = r.bn.machine;
    const cands = Object.entries(S.operators).filter(([id,o]) => o.line===lid && o.skills && num(o.skills[mc])>0 && o.proc!==r.bn.id)
      .map(([id,o]) => { const cur = l.processes.find(p=>p.id===o.proc); const cx = cur ? r.procs.find(x=>x.p.id===cur.id) : null; return {o, sk:num(o.skills[mc]), from:cur?cur.name:t("o_none"), load:cx?cx.load:0}; })
      .sort((a,b) => (b.sk - a.sk) || (a.load - b.load)).slice(0,3);
    h += `<h2 style="margin-top:16px">${t("best_ops")} <span class="muted small">(${esc(mc)})</span></h2>`;
    h += cands.length ? `<div class="chips">${cands.map(c=>`<span class="chip">${esc(c.o.name||c.o.code)}: ${fmt(c.sk)}% <span class="muted">${esc(c.from)}</span></span>`).join("")}</div>` : `<p class="small muted">${t("best_ops_none")}</p>`;
  }
  h += `</section></div>`;
  if (window.__sample) {
    const ai = S.ai[lineId(l.no)] || {};
    h += `<section class="panel noprint"><div class="row"><h2 style="margin:0">${t("ai_title")}</h2><span class="spacer"></span><button class="btn" data-act="ai" ${ai.busy?"disabled":""}>${ai.busy?t("ai_wait"):t("ai_btn")}</button></div>${ai.text?`<div class="ai-out">${esc(ai.text)}</div>`:""}</section>`;
  }
  return h;
}
function capChart(r){
  const items = r.procs.filter(x => num(x.p.sam) > 0);
  if (!items.length) return "";
  const W = 520, rowH = 28, top = 6, left = 150, right = 44, H = top + items.length*rowH + 22;
  const max = Math.max(r.targetHourly, ...items.map(x=>x.eff)) * 1.1 || 1;
  const X = v => left + v/max*(W-left-right);
  let s = `<svg width="${W}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chart_cap"))}">`;
  items.forEach((x,i) => {
    const y = top + i*rowH, isBn = r.bn && x.p.id===r.bn.id;
    const nm = x.p.name.length > 22 ? x.p.name.slice(0,21)+"…" : x.p.name;
    s += `<text x="${left-8}" y="${y+16}" text-anchor="end">${esc(nm)}</text>
      <rect x="${left}" y="${y+4}" width="${Math.max(1,X(x.eff)-left)}" height="${rowH-10}" rx="3" fill="var(--${isBn?"bad":x.load>=85?"warn":"thread"})"/>
      <text x="${X(x.eff)+5}" y="${y+16}">${fmt(x.eff)}</text>`;
  });
  if (r.targetHourly) s += `<line x1="${X(r.targetHourly)}" x2="${X(r.targetHourly)}" y1="0" y2="${H-18}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${X(r.targetHourly)}" y="${H-4}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${t("lg_tgt")} ${fmt(r.targetHourly)}</text>`;
  s += `</svg>`;
  return `<div class="chart">${s}</div><div class="legend"><span><i style="background:var(--thread)"></i>${t("lg_cap")}</span><span><i style="background:var(--bad)"></i>${t("lg_bn")}</span><span><i style="background:var(--ink)"></i>${t("lg_tgt")}</span></div>`;
}
function refreshLineDerived(){
  const l = getLine(S.lineNo), r = calcLine(l, getProd(S.lineNo));
  const k = $("#lineKpis"); if (k) k.innerHTML = lineKpis(l, r);
  const d = $("#lineDerived"); if (d) d.innerHTML = lineDerived(l, r);
  // update computed cells in the process table without touching the inputs
  const anySkill = r.procs.some(x => x.scap != null);
  const sug = suggestMp(l.processes, r.sumMp);
  r.procs.forEach((x) => {
    const tr = $(`tr[data-pid="${x.p.id}"]`); if (!tr) return;
    const isBn = r.bn && x.p.id === r.bn.id, load = x.load;
    const col = isBn || load > 100 ? "bad" : load >= 85 ? "warn" : "ok";
    const lab = isBn ? t("bneck") : load > 100 ? t("over") : load >= 85 ? t("balanced") : t("normal");
    tr.classList.toggle("hot", !!isBn);
    const tds = tr.children, off = anySkill ? 1 : 0;
    if (tds[5]) tds[5].innerHTML = `<b>${fmt(x.cap)}</b>`;
    if (anySkill && tds[6]) tds[6].textContent = x.scap==null?"–":fmt(x.scap);
    if (tds[6+off]) tds[6+off].innerHTML = `<div class="row" style="gap:6px;justify-content:space-between"><span class="num small">${fmt(load)}%</span><span class="tag ${col}">${lab}</span></div><div class="load"><i style="width:${Math.min(100,load)}%;background:var(--${col})"></i></div>`;
    const s = sug ? sug.alloc[x.p.id] : null, dd = s != null ? s - num(x.p.mp) : 0;
    if (tds[7+off]) tds[7+off].innerHTML = `${s==null?"–":fmt(s,1)} ${dd>0?`<span class="delta-up">+${fmt(dd,1)}</span>`:dd<0?`<span class="delta-dn">${fmt(dd,1)}</span>`:""}`;
  });
}

function hourlyKpis(l, r){
  let fc;

  else { const remH = Math.max(0, r.hours - (r.lastIdx+1)); const need = remH ? Math.ceil(Math.max(0, r.targetDaily - r.out)/remH) : 0;
    fc = `<div class="note bad">${t("fc_bad",{p:fmt(r.forecast),g:fmt(r.targetDaily-r.forecast),h:fmt(remH),r:fmt(need)})}</div>`; }

    <div class="kpi ${r.dhu==null?"":r.dhu<=3?"ok":r.dhu<=6?"warn":"bad"}"><div class="l">DHU</div><div class="v">${r.dhu==null?"–":fmt(r.dhu,1)+"%"}</div><div class="s">${fmt(r.def)} ${t("pcs")}</div></div>

function refreshHourlyCells(){
  const n = S.lineNo, l = getLine(n), r = calcLine(l, getProd(n)), hrs = getProd(n).hours || [];
  let cum = 0;
  $$("tr[data-hi]").forEach(tr => {
    const i = +tr.dataset.hi, x = hrs[i];
    const has = x && x.o !== "" && x.o != null;
    if (has) cum += num(x.o);
    const ce = $("[data-cum]", tr), ee = $("[data-eff]", tr);
    ce.textContent = has ? fmt(cum)+" / "+fmt(r.targetHourly*(i+1)) : "";
    const av = r.activeMp * (60 - num(x && x.n));
    const e = has && av > 0 ? num(x.o)*r.smv/av*100 : null;
    const st = has ? hourStatus(x.o, r.targetHourly) : "";
    ee.innerHTML = e == null ? "" : `<span class="tag ${st}">${fmt(e,0)}%</span>`;
  });
}
function hourlyChart(l, r){
  const hrs = getProd(l.no).hours || [];
  const W = 720, H = 220, L = 40, B = 24, T = 10, bw = (W-L-8)/r.hours;
  const vals = Array.from({length:r.hours}, (_,i) => hrs[i] && hrs[i].o!==""&&hrs[i].o!=null ? num(hrs[i].o) : null);
  const max = Math.max(r.targetHourly, ...vals.map(v=>v||0)) * 1.15 || 1;
  const Y = v => T + (H-T-B) * (1 - v/max);
  let s = `<svg width="${W}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chart_hourly"))}">`;
  [0, .5, 1].forEach(f => { const v = Math.round(max*f/1.15); s += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  vals.forEach((v,i) => {
    const x = L + i*bw + bw*0.18, w = bw*0.64;
    if (v != null) s += `<rect x="${x}" y="${Y(v)}" width="${w}" height="${Y(0)-Y(v)}" rx="3" fill="var(--${hourStatus(v, r.targetHourly)})"/>`;
    s += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${fmt(i+1)}</text>`;
  });
  s += `<line x1="${L}" x2="${W}" y1="${Y(r.targetHourly)}" y2="${Y(r.targetHourly)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.5"/></svg>`;
  return `<div class="chart">${s}</div><div class="legend"><span><i style="background:var(--ok)"></i>≥95%</span><span><i style="background:var(--warn)"></i>85–95%</span><span><i style="background:var(--bad)"></i>&lt;85%</span><span><i style="background:var(--ink)"></i>${t("lg_htgt")}</span></div>`;
}

/* ---------- Operators & skills ---------- */
function opMachines(){
  const set = new Set(MACHINES);
  Object.values(S.lines).forEach(l => (l.processes||[]).forEach(p => p.machine && set.add(p.machine)));
  Object.values(S.operators).forEach(o => Object.keys(o.skills||{}).forEach(m => set.add(m)));
  return [...set];
}

  const pts = days.map(d => {

  [0,50,100].forEach(v=>{ s += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}%</text>`; });
  let d = ""; pts.forEach((v,i)=>{ if (v==null) return; d += (d?"L":"M")+X(i)+" "+Y(v); });
  s += `<path d="${d}" fill="none" stroke="var(--denim)" stroke-width="2.5"/>`;
  pts.forEach((v,i)=>{ if (v!=null) s += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--denim)"/><text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmt(v,0)}%</text>`; s += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fmt(+days[i].slice(8))}/${fmt(+days[i].slice(5,7))}</text>`; });

}

function findCols(rows, wants){
  for (let r=0; r<Math.min(rows.length, 15); r++){
    const hdr = rows[r].map(c => String(c).toLowerCase().trim()); const idx = {};
    for (const [k, pats] of Object.entries(wants)) idx[k] = hdr.findIndex(h => pats.some(p => h.includes(p)));
    if (idx.name >= 0 && idx.sam >= 0) return {row:r, idx};
  }
  return null;
}
function parseOB(rows){
  const f = findCols(rows, {name:["operation","process","প্রসেস","অপারেশন","description"], machine:["machine","m/c","মেশিন"], sam:["sam","smv","time","সময়"], mp:["mp","manpower","operator","জনবল","man"]});
  if (!f) return null;
  const out = [];
  for (let r=f.row+1; r<rows.length; r++){
    const row = rows[r], name = String(row[f.idx.name]||"").trim(), sam = num(row[f.idx.sam]);
    if (!name || sam <= 0) continue;

  }
  return out.length ? out : null;
}

$("#dateSel").addEventListener("change", e => { if (!e.target.value) return; if (S.mode==="local") Store.persistLocal(); S.date = e.target.value; Store.subscribeProd(); render(); });
function go(v){ if (location.hash === "#"+v) route(); else location.hash = "#"+v; }
function route(){ const h = location.hash.replace("#",""); S.view = VIEWS.includes(h) ? h : "floor"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);

/* ---------- start ---------- */
(async function init(){
  const h = location.hash.replace("#",""); S.view = VIEWS.includes(h) ? h : "floor";
  renderChrome(); render();
  await Store.init();
  render();
  try { if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(d => { downloadsNs = d; }).catch(()=>{});
    window.claude.use("sample").then(s => { if (s) { window.__sample = s; if (S.view === "line") scheduleRender(); } }).catch(()=>{});
  } } catch(e){}
})();
</script>
</body></html>
